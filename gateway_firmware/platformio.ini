; =============================================================================
; gateway_firmware — ATmega8 + nRF24L01+ PA/LNA, USB serial to PC
; =============================================================================
; Receives backbone uplink on the same nRF24 address as backbone_config ADDR_SERVER.
; Sends downlink to backbone pipe 2 address ADDR_GW_SERVER (see gateway_config.h).
; Wire payloads match backbone_firmware / node_firmware node_protocol.h (32 bytes).
; =============================================================================

[env:ATmega8]
platform = atmelavr
board = ATmega8
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Many bare ATmega8 boards use an ISP programmer (e.g. USBasp) instead of a bootloader:
; upload_protocol = usbasp
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  ; Tighten UART ring buffers on supported Arduino-AVR cores (saves SRAM).
  -DSERIAL_RX_BUFFER_SIZE=24
  -DSERIAL_TX_BUFFER_SIZE=24
