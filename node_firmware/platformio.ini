; =============================================================================
; PlatformIO — park payment reader NODE (ATmega8 + nRF24L01+)
; =============================================================================
;
; HARDWARE PROFILE
; ----------------
; MCU   : ATmega8 @ 16 MHz (MiniCore) — 8 KiB flash (minus bootloader), 1 KiB SRAM.
; Radio : nRF24L01+ on SPI (RF24 library) — CE/CSN default pins in node_config.h.
; RFID  : UART reader module on USART0 (Arduino Serial) — baud NODE_RFID_UART_BAUD.
;
; ROLE
; ----
; Reader nodes talk RF only to the backbone (never USB-serial to billing PC).
; Upload firmware via ISP/USBASP/etc.; monitor_speed should match RFID baud if you
; snoop the same USART during bench tests (avoid concurrent contention).
;
; ENVIRONMENTS (node1 … node4)
; ----------------------------
; Each env adds -DNODE_ID / -DNODE_READER_ID. NODE_ID must appear in
; backbone_firmware/include/backbone_nodes.h with identical NODE{n} RX bytes.
;
; MEMORY TUNING FLAGS (env:common → build_flags)
; ----------------------------------------------
; -Os + section gc                          → smallest code footprint.
; SERIAL_RX_BUFFER_SIZE / SERIAL_TX_BUFFER_SIZE → shrink Arduino UART queues (SRAM).
; NODE_RF_CHANNEL                           → RF mesh channel index (match backbone).
; NODE_STATUS_PUSH_MS                       → STATUS_PUSH heartbeat cadence.
; NODE_PAY_WAIT_MS                         → PAY_RESP timeout after swipe TX success.
; NODE_RADIO_FAIL_THRESHOLD                → RF TX failures before STATUS_ERROR.
; NODE_RADIO_APP_TX_RETRIES                → extra whole-frame retries + jitter.
; NODE_DEFAULT_TYPE_ID                     → SWIPE_REQ.type_id billing/category tag.
;
; SERIAL MONITOR / UPLOAD
; -----------------------
; monitor_speed 9600 — aligns with default NODE_RFID_UART_BAUD for passive sniffing.
; upload_speed 19200 — typical ISP default; raise if your programmer supports it.
;
; =============================================================================

[platformio]
default_envs = node1

[env:common]
platform = atmelavr
board = ATmega8
framework = arduino
monitor_speed = 9600
upload_speed = 19200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DSERIAL_RX_BUFFER_SIZE=32
  -DSERIAL_TX_BUFFER_SIZE=16
  -DNODE_RF_CHANNEL=100
  -DNODE_STATUS_PUSH_MS=60000UL
  -DNODE_PAY_WAIT_MS=1200UL
  -DNODE_RADIO_FAIL_THRESHOLD=8
  -DNODE_RADIO_APP_TX_RETRIES=3

[env:node1]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=1
  -DNODE_READER_ID=1

[env:node2]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=2
  -DNODE_READER_ID=1

[env:node3]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=3
  -DNODE_READER_ID=1

[env:node4]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=4
  -DNODE_READER_ID=1
