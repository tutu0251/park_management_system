; Park payment node — ATmega328P + nRF24L01+ + RFID (Serial mock for card UID).
; Per-node build: pio run -e node1 | node2 | node3 | node4

[platformio]
default_envs = node1

[env:common]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  -DNODE_RF_CHANNEL=100
  -DNODE_STATUS_PUSH_MS=60000UL
  -DNODE_PAY_WAIT_MS=1200UL
  -DNODE_RADIO_FAIL_THRESHOLD=8

[env:node1]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=1
  -DNODE_READER_ID=1

[env:node2]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=2
  -DNODE_READER_ID=1

[env:node3]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=3
  -DNODE_READER_ID=1

[env:node4]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=4
  -DNODE_READER_ID=1
