; =============================================================================
; PlatformIO — park payment reader NODE (ATmega8 + nRF24L01+)
; =============================================================================
;
; TARGET
; ------
; board = ATmega8  → 8 KiB flash (minus bootloader region MCUFRIEND/MiniCore),
;                     1 KiB SRAM. Framework: Arduino (MCUdude MiniCore).
;
; ROLE
; ----
; Reader nodes never attach USB-serially to the billing PC; they speak RF with the
; backbone only. USART0 goes to the game machine; RFID UART uses SoftwareSerial.
;
; BUILD VARIANTS
; --------------
; pio run -e node1   … node4  → compiles different NODE_ID / NODE_READER_ID macros.
; NODE_ID must exist in backbone_firmware/include/backbone_nodes.h with matching
; NODE{n} pipe bytes.
;
; MEMORY TUNING FLAGS (common.build_flags)
; ----------------------------------------
; -Os + -ffunction-sections/-fdata-sections + --gc-sections → smallest flash image.
; SERIAL_RX_BUFFER_SIZE / SERIAL_TX_BUFFER_SIZE → shrink Arduino UART queues on
;     SRAM-starved parts (trade-off: bursty UART hosts may drop chars if too small).
; NODE_RF_CHANNEL → must match backbone RF_CHANNEL.
; NODE_STATUS_PUSH_MS → periodic STATUS_PUSH cadence toward backbone.
; NODE_PAY_WAIT_MS → blocking window waiting PAY_RESP after SWIPE_REQ TX success.
; NODE_RADIO_FAIL_THRESHOLD → consecutive RF TX fails before STATUS_ERROR latch.
; NODE_RADIO_APP_TX_RETRIES → application-level retries inside node_radio_send_frame.
;
; SERIAL / UPLOAD
; ---------------
; monitor_speed 9600 — conservative default for factory UART bridges on ATmega8.
; upload_speed 19200 — common for ISP/STK500-class programmers; adjust per tool.
;
; =============================================================================

[platformio]
default_envs = node1

[env:common]
platform = atmelavr
board = ATmega8
framework = arduino
monitor_speed = 9600
upload_speed = 19200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DSERIAL_RX_BUFFER_SIZE=32
  -DSERIAL_TX_BUFFER_SIZE=16
  -DNODE_RF_CHANNEL=100
  -DNODE_STATUS_PUSH_MS=60000UL
  -DNODE_PAY_WAIT_MS=1200UL
  -DNODE_RADIO_FAIL_THRESHOLD=8
  -DNODE_RADIO_APP_TX_RETRIES=3

[env:node1]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=1
  -DNODE_READER_ID=1

[env:node2]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=2
  -DNODE_READER_ID=1

[env:node3]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=3
  -DNODE_READER_ID=1

[env:node4]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=4
  -DNODE_READER_ID=1
