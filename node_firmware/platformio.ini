; =============================================================================
; PlatformIO project: park payment NODE firmware
; =============================================================================
; Hardware target: Arduino Nano (ATmega328P) + nRF24L01+ radio.
; Role: reader-side node; sends card swipes to gateway, receives PAY_RESP,
;       pushes machine status. Serial is used to mock RFID UIDs for testing.
; Build a specific node: pio run -e node1   (or node2, node3, node4)
; =============================================================================

[platformio]
; Default environment when you run `pio run` with no -e flag.
default_envs = node1

; -----------------------------------------------------------------------------
; Shared settings for all node environments (toolchain, board, libraries).
; -----------------------------------------------------------------------------
[env:common]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  ; RF channel must match backbone and server radios (2.4 GHz band index).
  -DNODE_RF_CHANNEL=100
  ; Periodic STATUS_PUSH interval when status is non-online or changed (ms).
  -DNODE_STATUS_PUSH_MS=60000UL
  ; Max wait after SWIPE_REQ for PAY_RESP from gateway (ms).
  -DNODE_PAY_WAIT_MS=1200UL
  ; Consecutive radio TX failures before node marks machine STATUS_ERROR.
  -DNODE_RADIO_FAIL_THRESHOLD=8

; -----------------------------------------------------------------------------
; Node 1: NODE_ID and NODE_READER_ID are compiled into SWIPE_REQ frames.
; Must match backbone_firmware/include/backbone_nodes.h entry for this node.
; -----------------------------------------------------------------------------
[env:node1]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=1
  -DNODE_READER_ID=1

; -----------------------------------------------------------------------------
; Node 2
; -----------------------------------------------------------------------------
[env:node2]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=2
  -DNODE_READER_ID=1

; -----------------------------------------------------------------------------
; Node 3
; -----------------------------------------------------------------------------
[env:node3]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=3
  -DNODE_READER_ID=1

; -----------------------------------------------------------------------------
; Node 4
; -----------------------------------------------------------------------------
[env:node4]
extends = env:common
build_flags =
  ${env:common.build_flags}
  -DNODE_ID=4
  -DNODE_READER_ID=1
