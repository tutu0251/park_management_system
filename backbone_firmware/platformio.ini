; Park payment backbone (gateway) — ATmega328P + nRF24L01+
; Relays between multiple node readers and a server over nRF24.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  -DRADIO_FAIL_THRESHOLD=8
  -DSTATUS_POLL_MS=30000
  -DSERVER_REPLY_TIMEOUT_MS=1200

