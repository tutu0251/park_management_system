; =============================================================================
; backbone_firmware — ATmega8 + nRF24L01+ wireless RELAY
; =============================================================================
; Role: backbone (relay) node between reader nodes and the gateway.
;   Reader nodes  <-- nRF24 -->  Backbone (this MCU)  <-- nRF24 -->  Gateway
; Backbone NEVER talks to RFID readers, game machines, or PC directly.
; On-air payload layout matches node_firmware/include/node_protocol.h and
; gateway_firmware/include/gateway_protocol.h (fixed 32 bytes, packed structs).
; =============================================================================

[env:ATmega8]
platform = atmelavr
board = ATmega8
framework = arduino
monitor_speed = 115200
upload_speed = 19200
; Most bare ATmega8 boards flash via ISP; uncomment for USBasp:
; upload_protocol = usbasp

lib_deps = nrf24/RF24@^1.5.0

build_flags =
  ; Aggressive size optimization for ATmega8 (8 KB flash / 1 KB SRAM).
  -Os
  ; Shrink HW UART ring buffers — debug only, lines are short.
  -DSERIAL_RX_BUFFER_SIZE=16
  -DSERIAL_TX_BUFFER_SIZE=32

  ; --- Backbone tunables ---------------------------------------------------
  ; Pending SWIPE_REQ slots; PAY_RESP frames carry no txn id so we use FIFO
  ; correlation. Keep small to stay well within 1 KB SRAM budget.
  -DBACKBONE_PENDING_DEPTH=4
  ; Drop pending entries older than this so a lost PAY_RESP cannot mis-route a
  ; later answer to the wrong reader.
  -DBACKBONE_PENDING_TTL_MS=1500
  ; Application-level TX retry layer on top of nRF24 auto-ACK.
  -DBACKBONE_APP_TX_RETRIES=3
  ; Max millisecond backoff between retransmission attempts.
  -DBACKBONE_TX_BACKOFF_MS_MAX=20
  ; Consecutive TX failures before triggering radio recover().
  -DBACKBONE_RADIO_FAIL_THRESHOLD=8
  ; Set to 0 to compile out Serial debug entirely and reclaim flash + SRAM.
  -DBACKBONE_DEBUG_UART=1
