; =============================================================================
; PlatformIO project: park payment BACKBONE (gateway) firmware
; =============================================================================
; Hardware: Arduino Nano (ATmega328P) + nRF24L01+.
; Role: RF bridge — listens on gateway addresses, forwards node traffic to
;       "server" radio peer and relays PAY_RESP back to the correct node.
; =============================================================================

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.5.0
build_flags =
  ; Log / treat sustained failures to server radio after this many TX fails.
  -DRADIO_FAIL_THRESHOLD=8
  ; How often backbone proactively polls each node with CHECK_STATUS_REQ (ms).
  -DSTATUS_POLL_MS=30000
  ; After forwarding SWIPE_REQ, max wait for PAY_RESP from server pipe (ms).
  -DSERVER_REPLY_TIMEOUT_MS=1200
