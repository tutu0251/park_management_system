; =============================================================================
; Unified PlatformIO workspace — park RF stack (NODE + BACKBONE + GATEWAY)
; =============================================================================
;
; Layout:
;   firmware/src/node/      — reader MCU (RFID UART ↔ nRF24 toward backbone)
;   firmware/src/backbone/  — relay MCU (reader mesh ↔ gateway mesh)
;   firmware/src/gateway/   — USB-serial ↔ nRF24 toward backbone only
;   firmware/src/shared/    — park_rf_protocol.cpp (single wire-format implementation)
;   firmware/include/       — headers for all roles + shared park_rf_protocol.h
;
; Pick the environment matching the board you are flashing:
;   pio run -e node1
;   pio run -e backbone
;   pio run -e gateway
;
; RF addresses and channel defaults are documented in *_config.h headers; they must
; stay bitwise-identical across the three images deployed together.
;
; Offline builds:
;   python-offline\install-offline.ps1  — PlatformIO via pip wheels (no network)
;   scripts\prepare-offline.ps1         — toolchains + RF24 (run once while online)
; After both, pio run works without network.
; =============================================================================

[platformio]
default_envs = node1
; Project-local PlatformIO storage (portable with the repo / USB copy).
core_dir = .platformio-core

[env:atmega8_base]
platform = atmelavr
framework = arduino
board = ATmega8
upload_speed = 19200
; Pinned version — avoids registry lookups when building offline.
lib_deps = nrf24/RF24@1.6.0
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

; ----- Reader node -------------------------------------------------------------

[env:node_common]
extends = env:atmega8_base
monitor_speed = 9600
build_src_filter = +<node/> +<shared/>
build_flags =
  ${env:atmega8_base.build_flags}
  -DSERIAL_RX_BUFFER_SIZE=32
  -DSERIAL_TX_BUFFER_SIZE=16
  -DNODE_RF_CHANNEL=10
  -DNODE_STATUS_PUSH_MS=60000UL
  -DNODE_PAY_WAIT_MS=1200UL
  -DNODE_RADIO_FAIL_THRESHOLD=8
  -DNODE_RADIO_APP_TX_RETRIES=3

[env:node1]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=1
  -DNODE_READER_ID=1

[env:node2]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=2
  -DNODE_READER_ID=1

[env:node3]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=3
  -DNODE_READER_ID=1

[env:node4]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=4
  -DNODE_READER_ID=1


[env:node5]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=5
  -DNODE_READER_ID=1


[env:node6]
extends = env:node_common
build_flags =
  ${env:node_common.build_flags}
  -DNODE_ID=6
  -DNODE_READER_ID=1
; ----- Backbone relay --------------------------------------------------------

[env:backbone_common]
extends = env:atmega8_base
monitor_speed = 115200
build_src_filter = +<backbone/> +<shared/>
build_flags =
  ${env:atmega8_base.build_flags}
  -DSERIAL_RX_BUFFER_SIZE=16
  -DSERIAL_TX_BUFFER_SIZE=32
  -DBACKBONE_RF_CHANNEL=20
  -DBACKBONE_PENDING_DEPTH=4
  -DBACKBONE_PENDING_TTL_MS=1500
  -DBACKBONE_APP_TX_RETRIES=3
  -DBACKBONE_TX_BACKOFF_MS_MAX=20
  -DBACKBONE_RADIO_FAIL_THRESHOLD=8
  -DBACKBONE_DEBUG_UART=1

[env:backbone]
extends = env:backbone_common
build_flags =
  ${env:backbone_common.build_flags}
  -DBACKBONE_ID=1


[env:backbone2]
extends = env:backbone_common
build_flags =
  ${env:backbone_common.build_flags}
  -DBACKBONE_ID=2
; ----- USB gateway -----------------------------------------------------------

[env:gateway_common]
extends = env:atmega8_base
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<gateway/> +<shared/>
build_flags =
  ${env:atmega8_base.build_flags}
  -DSERIAL_RX_BUFFER_SIZE=24
  -DSERIAL_TX_BUFFER_SIZE=24
  -DGATEWAY_RF_CHANNEL=30

[env:gateway]
extends = env:gateway_common
build_flags =
  ${env:gateway_common.build_flags}
  -DGATEWAY_ID=1

[env:gateway2]
extends = env:gateway_common
build_flags =
  ${env:gateway_common.build_flags}
  -DGATEWAY_ID=2

[env:gateway3]
extends = env:gateway_common
build_flags =
  ${env:gateway_common.build_flags}
  -DGATEWAY_ID=3
